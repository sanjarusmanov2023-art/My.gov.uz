    <ellipse cx="44" cy="188" rx="8" ry="14" transform="rotate(-20 44 188)"/>
    <ellipse cx="62" cy="188" rx="8" ry="14" transform="rotate(20 62 188)"/>
  </g>
  <!-- cotton (right) -->
  <g fill="#f4f4f4" stroke="#cfcfcf" stroke-width="1">
    <circle cx="222" cy="196" r="10"/>
    <circle cx="212" cy="206" r="9"/>
    <circle cx="232" cy="206" r="9"/>
    <circle cx="222" cy="216" r="9"/>
    <circle cx="222" cy="206" r="6" fill="#e8a200"/>
  </g>
  <!-- ribbon -->
  <path d="M70 240 L210 240 L196 252 L84 252 Z" fill="#1a6fb5"/>
</svg>
